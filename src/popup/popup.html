<!doctype html>
<meta charset="utf-8">
<title>osu! MP3 Downloader</title>
<style>
  body { width: 260px; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; color: #222; }
  h1 { margin: 0 0 8px; font-size: 14px; }
  button { width: 100%; padding: 8px; font: inherit; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 6px; background: #ff66aa; color: #fff; }
  button:disabled { cursor: default; opacity: 0.5; }
  #status { margin: 8px 0 0; min-height: 1.3em; word-break: break-word; }
  #status.error { color: #b00020; }
  .muted { color: #666; }
</style>
<h1>osu! MP3 Downloader</h1>
<p id="not-beatmap" class="muted" hidden>Navigate to a beatmap page on osu.ppy.sh first.</p>
<div id="beatmap" hidden>
  <p class="muted">Beatmapset <span id="set-id"></span></p>
  <button id="download">Download MP3</button>
  <p id="status"></p>
</div>
<script type="module" src="popup.js"></script>
