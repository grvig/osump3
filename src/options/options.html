<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osu! MP3 Downloader options</title>
<style>
  body { max-width: 560px; margin: 0 auto; padding: 24px 16px; font: 14px system-ui, sans-serif; color: #222; }
  h1 { font-size: 18px; }
  fieldset { margin: 0 0 16px; border: 1px solid #ddd; border-radius: 6px; }
  legend { font-weight: 600; padding: 0 4px; }
  label { display: block; margin: 6px 0; }
  .mirror { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .mirror span { flex: 1; }
  .hint { color: #666; font-size: 12px; margin: 4px 0; }
  [hidden] { display: none !important; }
  #saved { color: #2e7d32; min-height: 1.2em; }
</style>
<h1>osu! MP3 Downloader</h1>

<fieldset>
  <legend>Mirrors</legend>
  <p class="hint">Tried top to bottom. The next one is only used if the one above fails.</p>
  <div id="mirrors"></div>
</fieldset>

<fieldset>
  <legend>Tags and filename</legend>
  <label>Artist and title
    <select id="scheme">
      <option value="unicode">Original script, romanised when missing</option>
      <option value="romanised">Romanised</option>
    </select>
  </label>
  <label>Album
    <select id="albumMode">
      <option value="source">Beatmap source (anime, game, …)</option>
      <option value="fixed">Fixed text</option>
      <option value="blank">Leave blank</option>
    </select>
  </label>
  <label id="albumTextRow">Album text <input id="albumText" type="text"></label>
  <label><input id="embedCover" type="checkbox"> Embed the beatmap background as cover art</label>
</fieldset>

<fieldset>
  <legend>History</legend>
  <p class="hint">Used to warn before downloading the same set twice.</p>
  <button id="clearHistory" type="button">Clear download history</button>
  <span id="historyResult"></span>
</fieldset>

<p id="saved"></p>
<script type="module" src="options.js"></script>
